name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Check + unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check main process entry
        run: npm run check

      - name: Unit tests
        run: npm test

  package:
    name: Package smoke (electron-builder --dir)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unpackaged smoke build — proves the electron-builder config + file globs work
      # without needing the NSIS toolchain or code-signing cert.
      - name: Build unpacked app
        run: npx electron-builder --win --dir
